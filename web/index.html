<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RePlate — Web Preview</title>
<style>
  /* ===== Design tokens (brand from Theme.swift) ===== */
  :root {
    --primary: #118b50;
    --primary-end: #5db996;
    --primary-dark: #0d6b3d;
    --primary-soft: rgba(17,139,80,0.08);
    --primary-soft-strong: rgba(17,139,80,0.12);
    --gradient: linear-gradient(145deg, #118b50, #5db996);

    --ink: #16201b;
    --ink-2: #5d6b63;
    --ink-3: #93a099;
    --line: #e9ece9;
    --surface: #ffffff;
    --bg: #f6f8f6;

    --pending: #b76e00;  --pending-bg: #fbf0dd;
    --confirmed: #1763c4; --confirmed-bg: #e6eefb;
    --ready: #15803d;    --ready-bg: #e3f3e8;
    --done: #6b7770;     --done-bg: #eef1ee;

    --r-sm: 12px;
    --r-md: 16px;
    --r-lg: 22px;
    --r-pill: 999px;

    --shadow: 0 1px 2px rgba(17,139,80,0.04), 0 6px 20px rgba(20,50,35,0.06);
    --font: -apple-system, "SF Pro Text", "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; font-family: var(--font);
    background: radial-gradient(900px 600px at 50% -8%, #e4f1ea 0%, #eef2ef 42%, #e9ecea 100%);
    color: var(--ink); display: flex; align-items: center; justify-content: center;
    padding: 24px; -webkit-font-smoothing: antialiased;
  }
  svg { display: block; }
  .ico { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.75;
         fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .phone {
    width: 384px; height: 824px; max-height: calc(100vh - 48px);
    background: var(--bg); border-radius: 52px; border: 11px solid #0c0d0c;
    box-shadow: 0 40px 90px rgba(16,40,28,0.32), inset 0 0 2px rgba(255,255,255,0.35);
    position: relative; overflow: hidden; display: flex; flex-direction: column;

  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);

  .screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }

  /* role switch (preview control) */
  .roleswitch { position: absolute; bottom: 98px; left: 50%; transform: translateX(-50%); z-index: 60;
    display: flex; gap: 3px; padding: 3px; border-radius: var(--r-pill);
    background: rgba(20,32,27,0.62); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 8px 22px rgba(16,40,28,0.28); }
  .roleswitch button { border: none; background: transparent; color: rgba(255,255,255,0.82);
    font-family: var(--font); font-size: 11.5px; font-weight: 700; letter-spacing: 0.2px;
    padding: 6px 14px; border-radius: var(--r-pill); cursor: pointer; transition: all .15s ease; }
  .roleswitch button.on { background: #fff; color: var(--primary-dark); }

  /* header */
  .header { background: var(--gradient); color: #fff; padding: 60px 22px 26px;
    border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
  .header .greeting { font-size: 13px; opacity: 0.85; font-weight: 500; letter-spacing: 0.2px; }
  .header .title { font-size: 25px; font-weight: 700; margin-top: 3px; letter-spacing: -0.4px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; }

  .loc .ico { width: 15px; height: 15px; }

    border: 1px solid rgba(255,255,255,0.25); }
  .statuschip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    opacity: 0.95; margin-top: 9px; }
  .statuschip .dot { width: 8px; height: 8px; border-radius: 50%; background: #caf8a5; }

  .impact { display: flex; gap: 8px; margin-top: 20px; }
  .impact .stat { flex: 1; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.16);

  .impact .num { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .impact .lbl { font-size: 9.5px; opacity: 0.85; margin-top: 3px; letter-spacing: 0.2px; text-transform: uppercase; }

  .impact4 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 20px; }
  .impact4 .stat { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.16);
    border-radius: var(--r-md); padding: 14px; display: flex; align-items: center; gap: 11px; }
  .impact4 .stat .ico { width: 20px; height: 20px; stroke: #caf8a5; }
  .impact4 .num { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .impact4 .lbl { font-size: 10px; opacity: 0.85; margin-top: 1px; }

  /* content */
  .content { padding: 20px 16px 116px; }
  .h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 14px; }
  .section-head .link { color: var(--ink-3); font-size: 12.5px; font-weight: 500; }
  .screen-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin: 0 2px 18px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 8px 15px; border-radius: var(--r-pill);
    background: var(--surface); border: 1px solid var(--line);
    font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; transition: all .18s ease; }
  .chip:active { transform: scale(0.96); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; cursor: pointer; transition: transform .14s ease; }
  .card:active { transform: scale(0.985); }
  .photo { height: 138px; position: relative; display: flex; align-items: center; justify-content: center; }
  .photo .ico { width: 46px; height: 46px; stroke: rgba(255,255,255,0.92); stroke-width: 1.5; }
  .badge { position: absolute; top: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.2px;
    padding: 5px 10px; border-radius: var(--r-pill); }
  .badge.discount { left: 12px; background: #fff; color: var(--primary-dark); }
  .badge.free { left: 12px; background: #fff; color: var(--ready); }
  .badge.almost { right: 12px; background: rgba(0,0,0,0.32); color: #fff; backdrop-filter: blur(4px); }
  .card .body { padding: 14px 16px 16px; }
  .ttl { font-size: 15.5px; font-weight: 650; letter-spacing: -0.2px; }
  .rest { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  .rest .ico { width: 14px; height: 14px; }
  .rest .verified { color: var(--primary); }
  .rest .star { color: #e0a92b; }
  .rest .dot { color: var(--ink-3); }
  .diet { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 11px; }
  .tag { font-size: 10.5px; font-weight: 600; padding: 4px 9px; border-radius: var(--r-pill);
    background: var(--primary-soft); color: var(--primary-dark); }
  .price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 13px; }
  .price { display: flex; align-items: baseline; gap: 7px; }
  .price .now { font-size: 19px; font-weight: 750; color: var(--primary); letter-spacing: -0.4px; }
  .price .was { font-size: 12.5px; color: var(--ink-3); text-decoration: line-through; }
  .price .freep { font-size: 19px; font-weight: 750; color: var(--ready); letter-spacing: -0.4px; }
  .pickup { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
  .pickup .ico { width: 14px; height: 14px; }

  /* orders */
  .order { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 13px; }
  .order .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .status { font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: var(--r-pill); white-space: nowrap; }
  .order .code { margin-top: 15px; background: var(--bg); border-radius: var(--r-md); padding: 13px 14px;
    display: flex; align-items: center; justify-content: space-between; }
  .order .ck-lbl { font-size: 10px; color: var(--ink-3); font-weight: 700; letter-spacing: 0.4px; }
  .order .pin { font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 700;
    letter-spacing: 4px; color: var(--primary-dark); margin-top: 2px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
    margin-top: 13px; padding: 12px; border: none; border-radius: var(--r-md); cursor: pointer;
    font-family: var(--font); font-size: 14px; font-weight: 650; transition: transform .12s ease; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary .ico { stroke: #fff; width: 17px; height: 17px; }

  /* messages */
  .conv { display: flex; gap: 13px; align-items: center; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow); margin-bottom: 11px; cursor: pointer; transition: transform .14s ease; }
  .conv:active { transform: scale(0.985); }
  .conv .pic { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-soft-strong);
    color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-weight: 650; font-size: 15px; flex: 0 0 auto; }
  .conv .mid { flex: 1; min-width: 0; }
  .conv .name { font-weight: 650; font-size: 14.5px; }
  .conv .last { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv .meta { text-align: right; flex: 0 0 auto; }
  .conv .time { font-size: 11.5px; color: var(--ink-3); }
  .unread { background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; min-width: 19px; height: 19px;
    border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; margin-top: 7px; }

  /* profile */
  .profile-head { text-align: center; padding: 6px 0 2px; }
  .profile-head .pic { width: 82px; height: 82px; border-radius: 50%; background: var(--gradient); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 650; margin: 0 auto 12px; }
  .profile-head .nm { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .profile-head .nm .ico { width: 18px; height: 18px; color: var(--primary); }
  .profile-head .em { font-size: 13px; color: var(--ink-2); margin-top: 3px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .profile-head .em .ico { width: 14px; height: 14px; color: #e0a92b; }
  .pstats { display: flex; gap: 8px; margin: 20px 0; }
  .pstats .s { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 15px 8px; text-align: center; box-shadow: var(--shadow); }
  .pstats .n { font-size: 19px; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; }
  .pstats .l { font-size: 10px; color: var(--ink-2); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  .menu { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
  .menu .item { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-bottom: 1px solid var(--line);
    font-size: 14.5px; font-weight: 500; cursor: pointer; color: var(--ink); }
  .menu .item:last-child { border-bottom: none; }
  .menu .item:active { background: var(--bg); }
  .menu .item .lead { color: var(--primary); display: flex; }
  .menu .item .chev { margin-left: auto; color: var(--ink-3); display: flex; }
  .menu .item .chev .ico { width: 18px; height: 18px; }

  /* search */
  .searchbar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-pill); padding: 12px 16px; margin-bottom: 16px; box-shadow: var(--shadow); color: var(--ink-3); }
  .searchbar .ico { width: 18px; height: 18px; }
  .searchbar input { border: none; outline: none; flex: 1; font-size: 14.5px; font-family: var(--font); background: transparent; color: var(--ink); }
  .searchbar input::placeholder { color: var(--ink-3); }

  /* restaurant: CTA, listing rows, insights, form */
  .cta { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
    padding: 16px; border: none; border-radius: var(--r-md); background: var(--gradient); color: #fff;
    font-family: var(--font); font-size: 15.5px; font-weight: 700; cursor: pointer; margin-bottom: 22px;
    box-shadow: 0 8px 20px rgba(17,139,80,0.28); transition: transform .12s ease; }
  .cta:active { transform: scale(0.985); }
  .cta .ico { stroke: #fff; width: 20px; height: 20px; }

  .lrow { display: flex; align-items: center; gap: 13px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 13px; box-shadow: var(--shadow); margin-bottom: 11px; }
  .lrow .licon { width: 46px; height: 46px; border-radius: var(--r-sm); background: var(--primary-soft-strong);

  .lrow .licon .ico { color: var(--primary); width: 22px; height: 22px; }
  .lrow .lmid { flex: 1; min-width: 0; }
  .lrow .lt { font-size: 14.5px; font-weight: 650; }
  .lrow .lsub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .availpill { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: var(--r-pill);
    background: var(--ready-bg); color: var(--ready); }
  .availpill.low { background: var(--pending-bg); color: var(--pending); }

  .igrid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 22px; }
  .ibox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);

  .ibox .in { font-size: 23px; font-weight: 750; letter-spacing: -0.5px; color: var(--ink); }

  .ibox .itrend .ico { width: 13px; height: 13px; stroke: var(--ready); }

  .barchart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);

  .bars { display: flex; align-items: flex-end; gap: 9px; height: 110px; margin-top: 14px; }
  .bars .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
  .bars .bar { width: 100%; border-radius: 6px 6px 3px 3px; background: var(--gradient); }
  .bars .day { font-size: 10px; color: var(--ink-3); font-weight: 600; }

  .toplist .trow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .toplist .trow:last-child { border-bottom: none; }
  .toplist .rank { width: 22px; height: 22px; border-radius: 50%; background: var(--primary-soft-strong);

  .toplist .tname { flex: 1; font-size: 13.5px; font-weight: 600; }

  .formhead { display: flex; align-items: center; justify-content: space-between; padding-top: 56px; margin-bottom: 18px; }
  .formhead .ft { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .formhead .fbtn { font-size: 14.5px; font-weight: 650; cursor: pointer; }
  .formhead .cancel { color: var(--ink-2); }
  .formhead .post { color: var(--primary); }
  .field { margin-bottom: 16px; }
  .field .fl { font-size: 12px; font-weight: 650; color: var(--ink-2); margin-bottom: 7px; letter-spacing: 0.2px; }

  .frow { display: flex; gap: 12px; }
  .frow .field { flex: 1; }
  .seg { display: flex; gap: 7px; flex-wrap: wrap; }
  .seg .opt { font-size: 12.5px; font-weight: 600; padding: 9px 14px; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
  .seg .opt.on { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* tab bar */
  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 82px;
    background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); border-top: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-around; padding-top: 11px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-3);

  .tab .ico { width: 23px; height: 23px; }
  .tab.active { color: var(--primary); }

  .empty { text-align: center; color: var(--ink-2); padding: 56px 20px; }
  .empty .ico { width: 40px; height: 40px; margin: 0 auto 14px; stroke: var(--ink-3); }
</style>

    bakery: '<path d="M20 21v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7"/><path d="M4 16c1 0 1.5-1 2.5-1s1.7 1.5 3 1.5 2-1.5 3-1.5 1.7 1.5 3 1.5 1.5-1 2.5-1"/><path d="M3 21h18"/><path d="M8 9V6M12 9V6M16 9V6"/>',
    produce: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.85-5.4 5.1-6"/>',
    desserts: '<path d="m7 11 4.1 9.5a1 1 0 0 0 1.8 0L17 11"/><path d="M17 7a5 5 0 0 0-10 0"/><path d="M17 7a2 2 0 0 1 0 4H7a2 2 0 0 1 0-4"/>',
    beverages: '<path d="M10 2v2M14 2v2"/><path d="M5 8h13a3.5 3.5 0 0 1 0 7h-1"/><path d="M5 8v9a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4V8Z"/>',
    snacks: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  };
  const icon = (name, cls='ico') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[name]||''}</svg>`;

  /* ===== Customer mock data (from MockData.swift) ===== */
  const RESTAURANTS = {
    "1": { name: "Green Leaf Bistro", verified: true, rating: 4.8, c1: "#118b50", c2: "#5db996" },
    "2": { name: "Sunset Cafe",       verified: true, rating: 4.6, c1: "#0f7a64", c2: "#4fb08c" },
    "3": { name: "Ocean View Grill",  verified: true, rating: 4.7, c1: "#0d6b4a", c2: "#52a883" },
  };
  const CAT_ICON = { Meals:"meals", Bakery:"bakery", Produce:"produce", Beverages:"beverages", Desserts:"desserts", Snacks:"snacks", Other:"bag" };
  const LISTINGS = [
    { restId:"1", title:"Fresh Garden Salad Mix", category:"Meals", original:15.99, price:7.99, free:false, available:3, diet:["Vegetarian","Vegan","Gluten-Free"], pickup:"Pickup in 1 hr" },
    { restId:"2", title:"Artisan Bread & Pastries", category:"Bakery", original:12.50, price:0, free:true, available:6, diet:["Vegetarian"], pickup:"Pickup in 30 min" },
    { restId:"3", title:"Grilled Salmon Platter", category:"Meals", original:28.99, price:12.99, free:false, available:2, diet:["Gluten-Free","Dairy-Free"], pickup:"Pickup in 45 min" },
    { restId:"1", title:"Organic Fruit Bowl", category:"Produce", original:8.99, price:3.99, free:false, available:8, diet:["Vegan","Gluten-Free","Dairy-Free"], pickup:"Pickup in 1 hr" },
    { restId:"2", title:"Gourmet Dessert Box", category:"Desserts", original:18.99, price:8.99, free:false, available:1, diet:["Vegetarian"], pickup:"Pickup in 30 min" },
  ];
  const ORDERS = [
    { listing:"Fresh Garden Salad Mix", rest:"1", qty:2, total:15.98, status:"Pending", key:"pending", code:"A1B2C3", window:"Today 6-8 PM" },
    { listing:"Artisan Bread & Pastries", rest:"2", qty:1, total:0, status:"Confirmed", key:"confirmed", code:"D4E5F6", window:"Today 5:30-7 PM" },
    { listing:"Grilled Salmon Platter", rest:"3", qty:1, total:12.99, status:"Ready", key:"ready", code:"G7H8I9", window:"Ready now" },
    { listing:"Fresh Garden Salad Mix", rest:"1", qty:1, total:7.99, status:"Completed", key:"done", code:"J1K2L3", window:"Picked up" },
  ];
  const CONVERSATIONS = [
    { name:"Green Leaf Bistro", init:"GL", last:"Perfect, see you at 6:30 PM.", time:"2m", unread:1 },
    { name:"Sunset Cafe", init:"SC", last:"Your free pastries are reserved.", time:"1h", unread:0 },
    { name:"Ocean View Grill", init:"OV", last:"Order is ready for pickup.", time:"3h", unread:0 },
  ];
  const IMPACT = { mealsSaved: 24, co2: 60, food: 48.5 };
  const USER = { name: "John Doe", email: "customer@example.com", init: "JD" };
  const CATEGORIES = ["All","Meals","Bakery","Produce","Beverages","Desserts","Snacks"];

  /* ===== Restaurant mock data (from MockData.swift sampleRestaurantUser) ===== */
  const STORE = { name:"Green Leaf Bistro", init:"GL", rating:4.8, reviews:342, mealsSaved:156, co2:390, food:312, active:3 };
  const R_LISTINGS = [
    { title:"Fresh Garden Salad Mix", cat:"Meals", price:7.99, available:3, total:5 },
    { title:"Organic Fruit Bowl", cat:"Produce", price:3.99, available:8, total:10 },
    { title:"Grilled Salmon Platter", cat:"Meals", price:12.99, available:2, total:4 },
  ];
  const R_ORDERS = [
    { item:"Fresh Garden Salad Mix", customer:"Priya Nair", init:"PN", qty:2, total:15.98, status:"New", key:"pending", code:"A1B2C3", window:"Pickup 6-8 PM", action:"Confirm order" },
    { item:"Grilled Salmon Platter", customer:"Marcus Webb", init:"MW", qty:1, total:12.99, status:"Confirmed", key:"confirmed", code:"G7H8I9", window:"Pickup 5:30-7 PM", action:"Mark ready" },
    { item:"Organic Fruit Bowl", customer:"Elena Duarte", init:"ED", qty:1, total:3.99, status:"Ready", key:"ready", code:"K2M9P4", window:"Awaiting pickup", action:"Confirm pickup" },
  ];
  const INSIGHTS = { week:[42,38,51,47,63,58,71], top:[["Garden Salad Mix",48],["Organic Fruit Bowl",36],["Dessert Box",29]] };

  const money = n => "$" + n.toFixed(2);
  const pct = (o,p) => Math.round(((o-p)/o)*100);

  /* ===== shared component ===== */
  function listingCard(l) {
    const r = RESTAURANTS[l.restId];
    const badge = l.free ? `<span class="badge free">FREE</span>` : `<span class="badge discount">-${pct(l.original,l.price)}%</span>`;
    const almost = l.available <= 2 ? `<span class="badge almost">${l.available} left</span>` : "";
    const priceBlock = l.free ? `<span class="freep">Free</span>` : `<span class="now">${money(l.price)}</span><span class="was">${money(l.original)}</span>`;
    const diet = l.diet.map(d => `<span class="tag">${d}</span>`).join("");
    return `<article class="card">
      <div class="photo" style="background:linear-gradient(145deg, ${r.c1}, ${r.c2})">${icon(CAT_ICON[l.category])}${badge}${almost}</div>
      <div class="body">
        <div class="ttl">${l.title}</div>
        <div class="rest"><span>${r.name}</span>${r.verified ? icon('verified','ico verified') : ''}<span class="dot">&middot;</span>${icon('star','ico star')}<span>${r.rating}</span></div>
        <div class="diet">${diet}</div>
        <div class="price-row"><div class="price">${priceBlock}</div><div class="pickup">${icon('clock')}<span>${l.pickup}</span></div></div>
      </div>
    </article>`;
  }

  function rorderCard(o) {
    const showBtn = o.key !== 'done';
    return `<div class="order">
      <div class="top">
        <div style="display:flex;gap:11px;align-items:center;min-width:0">
          <div style="width:42px;height:42px;border-radius:50%;background:var(--primary-soft-strong);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:14px;flex:0 0 auto">${o.init}</div>
          <div style="min-width:0"><div class="ttl">${o.item}</div><div class="rest"><span>${o.customer}</span><span class="dot">&middot;</span><span>Qty ${o.qty}</span></div></div>
        </div>
        <span class="status" style="color:var(--${o.key});background:var(--${o.key}-bg)">${o.status}</span>
      </div>
      <div class="code">
        <div><div class="ck-lbl">PICKUP CODE</div><div class="pin">${o.code}</div></div>
        <div style="text-align:right"><div style="font-size:11.5px;color:var(--ink-2)">${o.window}</div><div style="font-weight:750;margin-top:3px;letter-spacing:-0.3px">${o.total===0?'Free':money(o.total)}</div></div>
      </div>
      ${showBtn ? `<button class="btn btn-primary">${icon('check')}<span>${o.action}</span></button>` : ''}
    </div>`;
  }

  /* ===== Screens ===== */
  const screens = {
    /* Customer */
    home() {
      return `
      <header class="header">
        <div class="header-row">
          <div>
            <div class="greeting">Good evening</div>
            <div class="title">Find food nearby</div>
            <div class="loc">${icon('pin')}<span>San Francisco, CA</span></div>
          </div>
          <div class="avatar">${USER.init}</div>
        </div>
        <div class="impact">
          <div class="stat"><div class="num">${IMPACT.mealsSaved}</div><div class="lbl">Meals saved</div></div>
          <div class="stat"><div class="num">${IMPACT.co2} kg</div><div class="lbl">CO2 cut</div></div>
          <div class="stat"><div class="num">${IMPACT.food} lb</div><div class="lbl">Rescued</div></div>
        </div>
      </header>
      <div class="content">
        <div class="chips">${CATEGORIES.map((c,i)=>`<div class="chip ${i===0?'active':''}" onclick="filterCat(this,'${c}')">${c}</div>`).join("")}</div>
        <div class="section-head"><div class="h2">Available now</div><span class="link">${LISTINGS.length} nearby</span></div>
        <div id="listings">${LISTINGS.map(listingCard).join("")}</div>
      </div>`;
    },
    search() {
      return `
      <div class="content" style="padding-top:58px">
        <div class="screen-title">Search</div>
        <div class="searchbar">${icon('search')}<input placeholder="Search food or restaurants" /></div>
        <div class="chips">${CATEGORIES.map((c,i)=>`<div class="chip ${i===0?'active':''}" onclick="filterCat(this,'${c}')">${c}</div>`).join("")}</div>
        <div class="section-head"><div class="h2">Results</div></div>
        <div id="listings">${LISTINGS.map(listingCard).join("")}</div>
      </div>`;
    },
    orders() {
      const card = o => {
        const r = RESTAURANTS[o.rest];
        return `<div class="order">
          <div class="top">
            <div><div class="ttl">${o.listing}</div><div class="rest"><span>${r.name}</span><span class="dot">&middot;</span><span>Qty ${o.qty}</span></div></div>
            <span class="status" style="color:var(--${o.key});background:var(--${o.key}-bg)">${o.status}</span>
          </div>
          <div class="code">
            <div><div class="ck-lbl">PICKUP CODE</div><div class="pin">${o.code}</div></div>
            <div style="text-align:right"><div style="font-size:11.5px;color:var(--ink-2)">${o.window}</div><div style="font-weight:750;margin-top:3px;letter-spacing:-0.3px">${o.total===0?'Free':money(o.total)}</div></div>
          </div>
        </div>`;
      };
      return `<div class="content" style="padding-top:58px"><div class="screen-title">My Orders</div>${ORDERS.map(card).join("")}</div>`;
    },
    messages() {
      const conv = c => `<div class="conv">
        <div class="pic">${c.init}</div>
        <div class="mid"><div class="name">${c.name}</div><div class="last">${c.last}</div></div>
        <div class="meta"><div class="time">${c.time}</div>${c.unread?`<div><span class="unread">${c.unread}</span></div>`:''}</div>
      </div>`;
      return `<div class="content" style="padding-top:58px"><div class="screen-title">Messages</div>${CONVERSATIONS.map(conv).join("")}</div>`;
    },
    profile() {
      const menu = [["pin","Saved addresses"],["card","Payment methods"],["bell","Notifications"],["leaf","My impact"],["sliders","Settings"],["help","Help & support"],["doc","Terms & Privacy"]];
      return `
      <div class="content" style="padding-top:58px">
        <div class="profile-head"><div class="pic">${USER.init}</div><div class="nm">${USER.name}</div><div class="em">${USER.email}</div></div>
        <div class="pstats">
          <div class="s"><div class="n">${IMPACT.mealsSaved}</div><div class="l">Meals saved</div></div>
          <div class="s"><div class="n">${IMPACT.co2} kg</div><div class="l">CO2 cut</div></div>
          <div class="s"><div class="n">${IMPACT.food} lb</div><div class="l">Rescued</div></div>
        </div>
        <div class="menu">${menu.map(m=>`<div class="item"><span class="lead">${icon(m[0])}</span>${m[1]}<span class="chev">${icon('chevron')}</span></div>`).join("")}</div>
      </div>`;
    },

    /* Restaurant */
    dashboard() {
      const lrow = l => `<div class="lrow">
        <div class="licon">${icon(CAT_ICON[l.cat])}</div>
        <div class="lmid"><div class="lt">${l.title}</div><div class="lsub">${money(l.price)} &middot; ${l.available} of ${l.total} left</div></div>
        <span class="availpill ${l.available<=2?'low':''}">${l.available} left</span>
      </div>`;
      return `
      <header class="header">
        <div class="header-row">
          <div>
            <div class="greeting">Welcome back</div>
            <div class="title">${STORE.name}</div>
            <div class="statuschip"><span class="dot"></span><span>Store open &middot; High impact</span></div>
          </div>
          <div class="avatar">${STORE.init}</div>
        </div>
        <div class="impact4">
          <div class="stat">${icon('leaf')}<div><div class="num">${STORE.mealsSaved}</div><div class="lbl">Meals saved</div></div></div>
          <div class="stat">${icon('trend')}<div><div class="num">${STORE.co2} kg</div><div class="lbl">CO2 cut</div></div></div>
          <div class="stat">${icon('package')}<div><div class="num">${STORE.food} lb</div><div class="lbl">Rescued</div></div></div>
          <div class="stat">${icon('bag')}<div><div class="num">${STORE.active}</div><div class="lbl">Active listings</div></div></div>
        </div>
      </header>
      <div class="content">
        <button class="cta" onclick="go('post')">${icon('plus')}<span>Post surplus food</span></button>
        <div class="section-head"><div class="h2">Your listings</div><span class="link">${R_LISTINGS.length} active</span></div>
        ${R_LISTINGS.map(lrow).join("")}
        <div class="section-head" style="margin-top:22px"><div class="h2">Today's orders</div><span class="link" onclick="go('rorders')" style="cursor:pointer;color:var(--primary)">View all</span></div>
        ${R_ORDERS.slice(0,2).map(rorderCard).join("")}
      </div>`;
    },
    insights() {
      const max = Math.max(...INSIGHTS.week);
      const days = ["M","T","W","T","F","S","S"];
      const bars = INSIGHTS.week.map((v,i)=>`<div class="col"><div class="bar" style="height:${Math.round(v/max*92)}px"></div><div class="day">${days[i]}</div></div>`).join("");
      const top = INSIGHTS.top.map((t,i)=>`<div class="trow"><div class="rank">${i+1}</div><div class="tname">${t[0]}</div><div class="tcount">${t[1]} saved</div></div>`).join("");
      return `
      <div class="content" style="padding-top:58px">
        <div class="screen-title">Insights</div>
        <div class="igrid">
          <div class="ibox"><div class="in">127</div><div class="il">Meals saved this week</div><div class="itrend">${icon('trend')}<span>+18% vs last week</span></div></div>
          <div class="ibox"><div class="in">$842</div><div class="il">Revenue recovered</div><div class="itrend">${icon('trend')}<span>+9% vs last week</span></div></div>
          <div class="ibox"><div class="in">63</div><div class="il">Orders fulfilled</div><div class="itrend">${icon('trend')}<span>+12% vs last week</span></div></div>
          <div class="ibox"><div class="in">41%</div><div class="il">Repeat customers</div><div class="itrend">${icon('trend')}<span>+4% vs last week</span></div></div>
        </div>
        <div class="barchart">
          <div class="h2">Meals rescued this week</div>
          <div class="bars">${bars}</div>
        </div>
        <div class="barchart toplist">
          <div class="h2" style="margin-bottom:4px">Top rescued items</div>
          ${top}
        </div>
      </div>`;
    },
    rorders() {
      return `<div class="content" style="padding-top:58px"><div class="screen-title">Incoming Orders</div>${R_ORDERS.map(rorderCard).join("")}</div>`;
    },
    post() {
      const cats = ["Meals","Bakery","Produce","Beverages","Desserts","Snacks"];
      return `
      <div class="content" style="padding-top:0">
        <div class="formhead">
          <span class="fbtn cancel" onclick="go('dashboard')">Cancel</span>
          <span class="ft">Post Surplus</span>
          <span class="fbtn post" onclick="go('dashboard')">Post</span>
        </div>
        <div class="field"><div class="fl">ITEM NAME</div><div class="finput ph">e.g. Fresh Garden Salad Mix</div></div>
        <div class="field"><div class="fl">DESCRIPTION</div><div class="finput ph" style="min-height:64px">Tell customers what's included...</div></div>
        <div class="field"><div class="fl">CATEGORY</div><div class="seg">${cats.map((c,i)=>`<span class="opt ${i===0?'on':''}">${c}</span>`).join("")}</div></div>
        <div class="frow">
          <div class="field"><div class="fl">ORIGINAL PRICE</div><div class="finput">$15.99</div></div>
          <div class="field"><div class="fl">YOUR PRICE</div><div class="finput" style="color:var(--primary);font-weight:700">$7.99</div></div>
        </div>
        <div class="frow">
          <div class="field"><div class="fl">QUANTITY</div><div class="finput">5</div></div>
          <div class="field"><div class="fl">PICKUP WINDOW</div><div class="finput">6:00 - 8:00 PM</div></div>
        </div>
        <button class="cta" style="margin-top:6px" onclick="go('dashboard')">${icon('plus')}<span>Post listing</span></button>
      </div>`;
    },
    rprofile() {
      const menu = [["store","Edit store profile"],["clock","Opening hours"],["wallet","Payouts & banking"],["verified","Verification"],["bell","Notifications"],["sliders","Settings"],["help","Help & support"],["logout","Sign out"]];
      return `
      <div class="content" style="padding-top:58px">
        <div class="profile-head">
          <div class="pic">${STORE.init}</div>
          <div class="nm">${STORE.name}${icon('verified')}</div>
          <div class="em">${icon('star')}<span>${STORE.rating} &middot; ${STORE.reviews} reviews</span></div>
        </div>
        <div class="pstats">
          <div class="s"><div class="n">${STORE.mealsSaved}</div><div class="l">Meals saved</div></div>
          <div class="s"><div class="n">${STORE.co2} kg</div><div class="l">CO2 cut</div></div>
          <div class="s"><div class="n">${STORE.active}</div><div class="l">Active</div></div>
        </div>
        <div class="menu">${menu.map(m=>`<div class="item"><span class="lead">${icon(m[0])}</span>${m[1]}<span class="chev">${icon('chevron')}</span></div>`).join("")}</div>
      </div>`;
    },
  };

  /* ===== Tabs + role ===== */
  const TABS_CUSTOMER = [
    { id:"home", icon:"home", label:"Home" },
    { id:"search", icon:"search", label:"Search" },
    { id:"orders", icon:"bag", label:"Orders" },
    { id:"messages", icon:"message", label:"Messages" },
    { id:"profile", icon:"user", label:"Profile" },
  ];
  const TABS_RESTAURANT = [
    { id:"dashboard", icon:"home", label:"Home" },
    { id:"insights", icon:"chart", label:"Insights" },
    { id:"rorders", icon:"bag", label:"Orders" },
    { id:"messages", icon:"message", label:"Messages" },
    { id:"rprofile", icon:"user", label:"Profile" },
  ];

  let role = "customer";
  let current = "home";

  function tabsForRole() { return role === "customer" ? TABS_CUSTOMER : TABS_RESTAURANT; }

  function render() {
    document.getElementById("screen").innerHTML = screens[current]();
    document.getElementById("screen").scrollTop = 0;
    const tabs = tabsForRole();
    const activeId = tabs.some(t => t.id === current) ? current : tabs[0].id;
    document.getElementById("tabbar").innerHTML = tabs.map(t =>
      `<div class="tab ${t.id===activeId?'active':''}" onclick="go('${t.id}')">${icon(t.icon)}<span>${t.label}</span></div>`).join("");
    document.getElementById("roleswitch").innerHTML =
      `<button class="${role==='customer'?'on':''}" onclick="setRole('customer')">Customer</button>` +
      `<button class="${role==='restaurant'?'on':''}" onclick="setRole('restaurant')">Restaurant</button>`;
  }
  function go(id){ current = id; render(); }
  function setRole(r){ if (r===role) return; role = r; current = r==='customer' ? 'home' : 'dashboard'; render(); }
  function filterCat(el, cat){
    el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    const list = (cat==="All") ? LISTINGS : LISTINGS.filter(l=>l.category===cat);
    const box = document.getElementById("listings");
    if (box) box.innerHTML = list.length ? list.map(listingCard).join("")
      : `<div class="empty">${icon('search')}<div>No ${cat.toLowerCase()} available right now</div></div>`;
  }
  window.go = go; window.filterCat = filterCat; window.setRole = setRole;
  render();
  </script>
</body>
</html>
